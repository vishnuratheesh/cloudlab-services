services:
  ts-n8n:
    image: tailscale/tailscale:v1.64.0
    container_name: ts-n8n
    hostname: n8n
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ../../data/tailscale/n8n:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - lab_network

  n8n-init:
    image: busybox:1.36.1
    container_name: n8n-init
    user: root
    command: chown -R 1000:1000 /home/node/.n8n
    volumes:
      - ../../data/n8n:/home/node/.n8n
    depends_on:
      - ts-n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.36.1
    container_name: n8n
    restart: unless-stopped
    network_mode: service:ts-n8n
    user: "1000:1000"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - ../../data/n8n:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      ts-n8n:
        condition: service_started

networks:
  lab_network:
    external: true
