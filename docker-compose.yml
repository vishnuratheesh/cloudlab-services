services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: unless-stopped
    hostname: unbound
    volumes:
      - ./config/unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      - private_network

  ts-pihole:
    image: tailscale/tailscale:latest
    container_name: ts-pihole
    restart: unless-stopped
    hostname: pihole
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # We disable Tailscale DNS so the container uses Docker DNS to resolve 'unbound'
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./data/tailscale/pihole:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    ports:
      # Expose port 53 to host for LAN devices (e.g. Home Router)
      - "53:53/tcp"
      - "53:53/udp"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    # No ports exposed directly; traffic comes via ts-pihole
    network_mode: service:ts-pihole
    environment:
      TZ: 'UTC'
      # Point to the unbound container
      PIHOLE_DNS: 'unbound#53'
      # WEBPASSWORD should be set via environment variable or .env file for security
      WEBPASSWORD: ${PIHOLE_PASSWORD:-admin}
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/pihole_dnsmasq:/etc/dnsmasq.d
      - ./config/pihole/02-tailscale.conf:/etc/dnsmasq.d/02-tailscale.conf:ro
    depends_on:
      - unbound
      - ts-pihole

  ts-npm:
    image: tailscale/tailscale:latest
    container_name: ts-npm
    hostname: npm
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Explicitly accepting DNS might be useful if NPM needs to resolve things via MagicDNS
      - TS_EXTRA_ARGS=--accept-dns=true
    volumes:
      - ./data/tailscale/npm:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm
    restart: unless-stopped
    network_mode: service:ts-npm
    environment:
      # NPM uses SQLite by default if DB params aren't provided, which is fine for this scale
      DISABLE_IPV6: 'true'
    volumes:
      - ./data/npm:/data
      - ./data/npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - ts-npm

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - private_network

  ts-n8n:
    image: tailscale/tailscale:latest
    container_name: ts-n8n
    hostname: n8n
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./data/tailscale/n8n:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    network_mode: service:ts-n8n
    user: "1000:1000"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - ./data/n8n:/home/node/.n8n
    depends_on:
      - postgres
      - ts-n8n

  ts-ollama:
    image: tailscale/tailscale:latest
    container_name: ts-ollama
    hostname: ollama
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./data/tailscale/ollama:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    network_mode: service:ts-ollama
    volumes:
      - ./data/ollama:/root/.ollama
    depends_on:
      - ts-ollama
    # Add deploy block to easily enable GPU in the future
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-pull-models:
    image: curlimages/curl:latest
    container_name: ollama-pull-models
    restart: "no"
    entrypoint: [""]
    networks:
      - private_network
    depends_on:
      ts-ollama:
        condition: service_started
      ollama:
        condition: service_started
    command: >
      sh -c "
      echo 'Waiting for Ollama to be available...' &&
      while ! curl -s http://ts-ollama:11434/api/tags >/dev/null; do sleep 5; done &&
      echo 'Ollama is up! Pulling llama3.1:8b...' &&
      curl -s -X POST http://ts-ollama:11434/api/pull -d '{\"name\": \"llama3.1:8b\"}' &&
      echo 'Pulling qwen2.5-coder:7b...' &&
      curl -s -X POST http://ts-ollama:11434/api/pull -d '{\"name\": \"qwen2.5-coder:7b\"}' &&
      echo 'Done!'"

  ts-uptime-kuma:
    image: tailscale/tailscale:latest
    container_name: ts-uptime-kuma
    hostname: uptime-kuma
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./data/tailscale/uptime-kuma:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    network_mode: service:ts-uptime-kuma
    volumes:
      - ./data/uptime-kuma:/app/data
    depends_on:
      - ts-uptime-kuma


  ts-open-webui:
    image: tailscale/tailscale:latest
    container_name: ts-open-webui
    hostname: open-webui
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./data/tailscale/open-webui:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    network_mode: service:ts-open-webui
    environment:
      - OLLAMA_BASE_URL=http://ts-ollama:11434
      # Provide WEBUI_SECRET_KEY in an .env file or environment for production
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-default_insecure_secret}
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ts-open-webui
      - ts-ollama

  ts-authelia:
    image: tailscale/tailscale:latest
    container_name: ts-authelia
    hostname: authelia
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - ./data/tailscale/authelia:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - private_network

  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    network_mode: service:ts-authelia
    volumes:
      - ./config/authelia:/config
    environment:
      - TZ=UTC
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${AUTHELIA_SESSION_SECRET}
      - AUTHELIA_ADMIN_PASSWORD_HASH=${AUTHELIA_ADMIN_PASSWORD_HASH}
    depends_on:
      - ts-authelia

networks:
  private_network:
    driver: bridge
