name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /lab"

      - name: Copy files to server
        run: |
          # Create a temporary archive of the current directory, excluding .git
          tar --exclude='.git' --exclude='.github' -czf deploy.tar.gz .
          # Copy archive to server
          scp deploy.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/lab/deploy.tar.gz
          # Extract on server
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /lab && tar -xzf deploy.tar.gz && rm deploy.tar.gz"

      - name: Create .env file and Deploy
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /lab && \
          echo 'TAILSCALE_IP=${{ secrets.TAILSCALE_IP }}' > .env && \
          echo 'PIHOLE_PASSWORD=${{ secrets.PIHOLE_PASSWORD }}' >> .env && \
          docker compose up -d --remove-orphans"
