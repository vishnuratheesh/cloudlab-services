name: Deploy to Cloudlab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /lab/docker/cloudlab"

      - name: Copy files to server
        run: |
          # Create a temporary archive of the current directory, excluding .git
          tar --exclude='.git' --exclude='.github' --exclude='./data' -czf /tmp/deploy.tar.gz .
          # Copy archive to server
          scp /tmp/deploy.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/lab/docker/cloudlab/deploy.tar.gz
          # Extract on server (Clean config and docker-compose first, but preserve data)
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /lab/docker/cloudlab && rm -rf config docker-compose.yml && tar -xzf deploy.tar.gz && rm deploy.tar.gz"

      - name: Create .env file and Deploy
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /lab/docker/cloudlab && \
          echo 'TAILSCALE_IP=${{ secrets.TAILSCALE_IP }}' > .env && \
          echo 'PIHOLE_PASSWORD=${{ secrets.PIHOLE_PASSWORD }}' >> .env && \
          echo 'TS_AUTHKEY=${{ secrets.TS_AUTHKEY }}' >> .env && \
          docker compose up -d --remove-orphans"
