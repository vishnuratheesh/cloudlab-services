name: Deploy to Cloudlab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudlab
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment directory
        run: ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "mkdir -p /lab/docker/cloudlab"

      - name: Copy files to server
        run: |
          # Create a temporary archive of the current directory, excluding .git and data
          tar --exclude='.git' --exclude='.github' --exclude='./data' -czf /tmp/deploy.tar.gz .
          # Copy archive to server
          scp /tmp/deploy.tar.gz ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/lab/docker/cloudlab/deploy.tar.gz
          # Extract on server. First gracefully bring down legacy monolithic stack if it exists to avoid container conflicts.
          # Then clean config, compose dir, and legacy docker-compose.yml, preserving data.
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /lab/docker/cloudlab && \
          if [ -f docker-compose.yml ]; then docker compose down; fi && \
          rm -rf config docker-compose.yml compose && tar -xzf deploy.tar.gz && rm deploy.tar.gz"

      - name: Create .env file and Deploy Stacks
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} "cd /lab/docker/cloudlab && \
          echo 'TAILSCALE_IP=${{ secrets.TAILSCALE_IP }}' > .env && \
          echo 'PIHOLE_PASSWORD=${{ secrets.PIHOLE_PASSWORD }}' >> .env && \
          echo 'TS_AUTHKEY=${{ secrets.TS_AUTHKEY }}' >> .env && \
          echo 'AUTHELIA_JWT_SECRET=${{ secrets.AUTHELIA_JWT_SECRET }}' >> .env && \
          echo 'AUTHELIA_SESSION_SECRET=${{ secrets.AUTHELIA_SESSION_SECRET }}' >> .env && \
          echo 'AUTHELIA_ADMIN_PASSWORD_HASH=${{ secrets.AUTHELIA_ADMIN_PASSWORD_HASH }}' >> .env && \
          echo 'AUTHELIA_STORAGE_ENCRYPTION_KEY=${{ secrets.AUTHELIA_STORAGE_ENCRYPTION_KEY }}' >> .env && \
          echo 'WEBUI_SECRET_KEY=${{ secrets.WEBUI_SECRET_KEY }}' >> .env && \
          docker network create lab_network || true && \
          for layer in network data ai-core ai-apps automation management; do \
            if [ -d \"compose/\$layer\" ]; then \
              (cd \"compose/\$layer\" && ln -sf ../../.env .env && docker compose up -d --remove-orphans); \
            fi; \
          done"
